<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="gallery-body">

  <div class="gallery-container">

    <h1>Our Wedding Memories 💛</h1>
    <p>Tap any photo to view fullscreen</p>

    <!-- NAV WRAPPER (IMPORTANT FOR VISIBILITY) -->
    <div style="
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:20px 0;
      position:relative;
      z-index:10;
    ">

      <button onclick="goToUpload()" style="
        padding:12px;
        border:none;
        border-radius:10px;
        background:#d4af37;
        color:black;
        font-weight:500;
        cursor:pointer;
        width:100%;
      ">
        Upload More Memories
      </button>

      <button onclick="window.location.href='upload.html'" style="
        padding:12px;
        border:none;
        border-radius:10px;
        background:rgba(255,255,255,0.15);
        color:white;
        font-weight:400;
        cursor:pointer;
        width:100%;
      ">
        Back to Upload
      </button>

    </div>

    <div id="galleryGrid"></div>

  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" />
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="app.js"></script>

</body>
</html>
